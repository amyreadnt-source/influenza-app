name: Build Windows Desktop App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
    - name: Install Nativefier Compiler
      run: npm install -g nativefier
    - name: Package Standalone Windows App (.exe)
      run: |
        nativefier --name "SmartLab_CDSS" --platform "windows" --arch "x64" --single-instance "https://streamlit.app"
    - name: Zip the Application Folder
      run: |
        zip -r SmartLab_CDSS_Windows.zip SmartLab_CDSS-win32-x64/
    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v3
      with:
        name: SmartLab_CDSS_Executable_App
        path: SmartLab_CDSS_Windows.zip
